<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JSONMend 演示 — 流式 JSON 修复与部分解析</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1f2328;
        --bg: #ffffff;
        --muted: #6a737d;
        --line: #d8dee4;
        --accent: #0969da;
        --code-bg: #f6f8fa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e6edf3;
          --bg: #0d1117;
          --muted: #8b949e;
          --line: #30363d;
          --accent: #58a6ff;
          --code-bg: #161b22;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 2rem 1rem 4rem;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      main { max-width: 960px; margin: 0 auto; }
      h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
      h2 { font-size: 1.1rem; margin: 2rem 0 .5rem; }
      p.lead { color: var(--muted); margin: 0 0 1.5rem; }
      textarea {
        width: 100%;
        min-height: 8rem;
        padding: .75rem;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--fg);
        background: var(--code-bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        resize: vertical;
      }
      pre {
        margin: .5rem 0 0;
        padding: .75rem;
        overflow-x: auto;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--code-bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      button {
        margin: .5rem .5rem 0 0;
        padding: .35rem .8rem;
        font: inherit;
        color: var(--fg);
        background: var(--code-bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      label { display: block; margin-top: 1rem; color: var(--muted); }
      input[type="range"] { width: 100%; }
      .grid { display: grid; gap: 1rem; grid-template-columns: 1fr; }
      @media (min-width: 800px) { .grid { grid-template-columns: 1fr 1fr; } }
      .label { color: var(--muted); font-size: .85rem; margin-top: .75rem; }
      code { background: var(--code-bg); padding: .1rem .3rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>JSONMend</h1>
      <p class="lead">
        流式 JSON 修复与部分解析库，纯 MoonBit 实现。本页由 MoonBit 的 JavaScript
        后端编译产物直接驱动，没有第二个实现。
      </p>

      <h2>一次性修复</h2>
      <p class="label">
        输入一段破损或截断的 JSON（单引号、注释、多余逗号、裸词、围栏、截断都可以），
        点击按钮查看修复结果与修复记录。
      </p>
      <textarea id="input">```json
{'name': 'MoonBit', // LLM 常见的注释
 'tags': ['json', 'repair',],
 'meta': {ok: true, score: NaN,}
}
```</textarea>
      <button id="run">修复</button>
      <button id="sample-valid">合法输入</button>
      <button id="sample-truncated">截断输入</button>
      <button id="sample-prose">前导说明（需 skip_prose）</button>

      <div class="grid">
        <div>
          <div class="label">修复后的文本（stdout）</div>
          <pre id="out">—</pre>
        </div>
        <div>
          <div class="label">修复记录（R 码 + 位置 + 说明）</div>
          <pre id="report">—</pre>
        </div>
      </div>

      <h2>流式快照</h2>
      <p class="label">
        拖动滑块只喂入前 N 个码元，查看 <code>snapshot()</code> 的部分结果、完整性状态
        与未闭合路径。快照是稳定前缀：输入增长时已确定的部分不会回退。
      </p>
      <input id="upto" type="range" min="0" max="0" value="0" />
      <div class="label" id="upto-label">N = 0</div>
      <pre id="snapshot">—</pre>

      <h2>命令行</h2>
      <pre id="cli">—</pre>
    </main>

    <script>
      // Host hooks: the MoonBit bundle calls these from its main function.
      globalThis.jsonmendRegister1 = function (name, fn) {
        globalThis.jsonmend = globalThis.jsonmend || {};
        globalThis.jsonmend[name] = fn;
      };
      globalThis.jsonmendRegister2 = globalThis.jsonmendRegister1;
    </script>
    <script src="./jsonmend.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const input = $("input");

      function refresh() {
        const text = input.value;
        $("upto").max = String(text.length);
        if (Number($("upto").value) > text.length) {
          $("upto").value = String(text.length);
        }
        $("out").textContent = globalThis.jsonmend.repair(text);
        $("report").textContent = globalThis.jsonmend.report(text);
        const upto = Number($("upto").value);
        $("upto-label").textContent = "N = " + upto + " / " + text.length;
        $("snapshot").textContent = globalThis.jsonmend.snapshot(text, upto);
      }

      function load(text) {
        input.value = text;
        $("upto").value = String(text.length);
        refresh();
      }

      input.addEventListener("input", refresh);
      $("run").addEventListener("click", refresh);
      $("upto").addEventListener("input", refresh);

      $("sample-valid").addEventListener("click", () =>
        load('{"name":"MoonBit","tags":["json","repair"],"meta":{"ok":true,"n":1.5e3}}'),
      );
      $("sample-truncated").addEventListener("click", () => load('{"name":"Mo'));
      $("sample-prose").addEventListener("click", () =>
        load('Sure! Here is the JSON you asked for:\n{"a":1,"b":[1,2,]}'),
      );

      $("cli").textContent = [
        "$ jsonmend < broken.json > fixed.json",
        "$ jsonmend --report --indent 2 broken.json",
        "$ jsonmend --check broken.json ; echo $?",
        "$ jsonmend --strict broken.json ; echo $?",
      ].join("\n");

      $("upto").max = String(input.value.length);
      $("upto").value = String(input.value.length);
      refresh();
    </script>
  </body>
</html>
