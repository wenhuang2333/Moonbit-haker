# Release artifacts (O-13): a tag produces a GitHub Release with the native CLI
# for Linux and macOS, the wasm-gc probe, the browser demo bundle and their
# checksums.
#
# The CLI is built on the runner whose operating system it targets, because a
# MoonBit native build links against the host toolchain. Everything is packaged
# in one final job so that a single `SHA256SUMS` covers every asset.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: wasm probe and browser bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install the MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build the probe and the demo bundle
        working-directory: code
        run: |
          moon build bench/probe --target wasm-gc --release
          moon build examples/web --target js --release

      - name: Rebuild the demo bundle and verify it is in sync
        run: |
          bash static/demo/build.sh
          git diff --exit-code -- static/demo/jsonmend.js

      # Stage the two files in one directory so the artifact has a flat,
      # predictable layout: upload-artifact keeps paths relative to the least
      # common ancestor, which would otherwise be the repository root.
      - name: Stage the web assets
        run: |
          mkdir -p "$RUNNER_TEMP/web-assets"
          cp code/_build/wasm-gc/release/build/bench/probe/probe.wasm "$RUNNER_TEMP/web-assets/probe.wasm"
          cp static/demo/jsonmend.js "$RUNNER_TEMP/web-assets/jsonmend-demo.js"

      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: ${{ runner.temp }}/web-assets

  cli:
    name: CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: jsonmend-linux-x86_64
          - os: macos-latest
            asset: jsonmend-macos-arm64
          - os: windows-latest
            asset: jsonmend-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install the MoonBit toolchain (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install the MoonBit toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build the CLI (Unix)
        if: runner.os != 'Windows'
        working-directory: code
        run: moon build cmd/jsonmend --target native --release

      - name: Build the CLI (Windows)
        if: runner.os == 'Windows'
        working-directory: code
        shell: pwsh
        run: moon build cmd/jsonmend --target native --release

      - name: Check the CLI runs (Unix)
        if: runner.os != 'Windows'
        working-directory: code
        run: |
          printf '{"a":1,}' | ./_build/native/release/build/cmd/jsonmend/jsonmend.exe
          ./_build/native/release/build/cmd/jsonmend/jsonmend.exe --version

      - name: Check the CLI runs (Windows)
        if: runner.os == 'Windows'
        working-directory: code
        shell: pwsh
        run: |
          '{"a":1,}' | & .\_build\native\release\build\cmd\jsonmend\jsonmend.exe
          & .\_build\native\release\build\cmd\jsonmend\jsonmend.exe --version
          '{"id":1,"method":"hello"}','{"id":2,"method":"shutdown"}' | & .\_build\native\release\build\cmd\jsonmend\jsonmend.exe serve

      - name: Stage the CLI
        shell: bash
        run: cp code/_build/native/release/build/cmd/jsonmend/jsonmend.exe "$RUNNER_TEMP/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}

  publish:
    name: Publish the release
    needs: [web, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/jsonmend-linux-x86_64/jsonmend-linux-x86_64 dist/jsonmend-linux-x86_64
          cp artifacts/jsonmend-macos-arm64/jsonmend-macos-arm64 dist/jsonmend-macos-arm64
          cp artifacts/jsonmend-windows-x86_64.exe/jsonmend-windows-x86_64.exe dist/jsonmend-windows-x86_64.exe
          cp artifacts/web-assets/probe.wasm dist/jsonmend-probe.wasm
          cp artifacts/web-assets/jsonmend-demo.js dist/jsonmend-demo.js
          chmod +x dist/jsonmend-linux-x86_64 dist/jsonmend-macos-arm64
          (cd dist && sha256sum jsonmend-linux-x86_64 jsonmend-macos-arm64 jsonmend-windows-x86_64.exe jsonmend-probe.wasm jsonmend-demo.js > SHA256SUMS)
          cat dist/SHA256SUMS

      # The release body is the section of CHANGELOG.md for this tag, not the
      # whole file: a release note that opens with "this file records every
      # change" and then lists six older versions is a file, not a note.
      - name: Extract this version's changelog section
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; print; next }
            inside && /^## \[/     { exit }
            inside                 { print }
          ' code/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "no CHANGELOG section for $version" >&2
            exit 1
          fi
          wc -l "$RUNNER_TEMP/notes.md"

      # `gh release create` is not idempotent, and a tag can be re-pointed at a
      # fixed commit, so replace any release that already exists for this tag.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false || true
          gh release create "$GITHUB_REF_NAME" \
            --title "JSONMend $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/jsonmend-linux-x86_64 \
            dist/jsonmend-macos-arm64 \
            dist/jsonmend-probe.wasm \
            dist/jsonmend-demo.js \
            dist/SHA256SUMS
