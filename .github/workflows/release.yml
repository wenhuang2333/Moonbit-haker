# Release artifacts (O-13): a tag produces a GitHub Release with the native CLI
# for Linux, macOS and Windows, the wasm-gc probe, the browser demo bundle and
# their checksums.
#
# The CLI is built on the runner whose operating system it targets, because a
# MoonBit native build links against the host toolchain. Everything is packaged
# in one final job so that a single `SHA256SUMS` covers every asset.
#
# Two rules keep the release honest, and both are enforced by a step rather
# than by review: every file the packaging step puts in `dist/` is attached to
# the release, and the published asset set is compared against the published
# `SHA256SUMS` after the release exists.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: wasm probe and browser bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install the MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build the probe and the demo bundle
        working-directory: code
        run: |
          moon build bench/probe --target wasm-gc --release
          moon build examples/web --target js --release

      - name: Rebuild the demo bundle and verify it is in sync
        run: |
          bash static/demo/build.sh
          git diff --exit-code -- static/demo/interjson.js

      # Stage the two files in one directory so the artifact has a flat,
      # predictable layout: upload-artifact keeps paths relative to the least
      # common ancestor, which would otherwise be the repository root.
      - name: Stage the web assets
        run: |
          mkdir -p "$RUNNER_TEMP/web-assets"
          cp code/_build/wasm-gc/release/build/bench/probe/probe.wasm "$RUNNER_TEMP/web-assets/probe.wasm"
          cp static/demo/interjson.js "$RUNNER_TEMP/web-assets/interjson-demo.js"

      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: ${{ runner.temp }}/web-assets

  cli:
    name: CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: interjson-linux-x86_64
          - os: macos-latest
            asset: interjson-macos-arm64
          - os: windows-latest
            asset: interjson-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install the MoonBit toolchain (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install the MoonBit toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build the CLI (Unix)
        if: runner.os != 'Windows'
        working-directory: code
        run: moon build cmd/interjson --target native --release

      - name: Build the CLI (Windows)
        if: runner.os == 'Windows'
        working-directory: code
        shell: pwsh
        run: moon build cmd/interjson --target native --release

      - name: Check the CLI runs (Unix)
        if: runner.os != 'Windows'
        working-directory: code
        run: |
          printf '{"a":1,}' | ./_build/native/release/build/cmd/interjson/interjson.exe
          ./_build/native/release/build/cmd/interjson/interjson.exe --version

      - name: Check the CLI runs (Windows)
        if: runner.os == 'Windows'
        working-directory: code
        shell: pwsh
        run: |
          '{"a":1,}' | & .\_build\native\release\build\cmd\interjson\interjson.exe
          & .\_build\native\release\build\cmd\interjson\interjson.exe --version
          '{"id":1,"method":"hello"}','{"id":2,"method":"shutdown"}' | & .\_build\native\release\build\cmd\interjson\interjson.exe serve

      - name: Stage the CLI
        shell: bash
        run: cp code/_build/native/release/build/cmd/interjson/interjson.exe "$RUNNER_TEMP/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}

  publish:
    name: Publish the release
    needs: [web, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/interjson-linux-x86_64/interjson-linux-x86_64 dist/interjson-linux-x86_64
          cp artifacts/interjson-macos-arm64/interjson-macos-arm64 dist/interjson-macos-arm64
          cp artifacts/interjson-windows-x86_64.exe/interjson-windows-x86_64.exe dist/interjson-windows-x86_64.exe
          cp artifacts/web-assets/probe.wasm dist/interjson-probe.wasm
          cp artifacts/web-assets/interjson-demo.js dist/interjson-demo.js
          chmod +x dist/interjson-linux-x86_64 dist/interjson-macos-arm64
          (cd dist && sha256sum interjson-linux-x86_64 interjson-macos-arm64 interjson-windows-x86_64.exe interjson-probe.wasm interjson-demo.js > SHA256SUMS)
          cat dist/SHA256SUMS

      # The release body is the section of CHANGELOG.md for this tag, not the
      # whole file: a release note that opens with "this file records every
      # change" and then lists six older versions is a file, not a note.
      - name: Extract this version's changelog section
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; print; next }
            inside && /^## \[/     { exit }
            inside                 { print }
          ' code/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "no CHANGELOG section for $version" >&2
            exit 1
          fi
          wc -l "$RUNNER_TEMP/notes.md"

      # The upload list used to be written out by hand. When the Windows
      # target was added to `dist/`, the list was not updated with it, so
      # v1.1.0 shipped a SHA256SUMS that named a file the release did not
      # carry -- a checksum file that sends a reader to download something
      # that is not there. The list is now derived from `dist/`, and this step
      # asserts that `dist/` holds exactly the expected six files *before*
      # anything is published: a release that does not match its own
      # checksums must never become public.
      - name: Check the release contents before publishing
        run: |
          set -euo pipefail
          want="SHA256SUMS interjson-demo.js interjson-linux-x86_64 interjson-macos-arm64 interjson-probe.wasm interjson-windows-x86_64.exe"
          actual="$(cd dist && ls -1 | sort | tr '\n' ' ' | sed 's/ $//')"
          sorted="$(printf '%s\n' $want | sort | tr '\n' ' ' | sed 's/ $//')"
          if [ "$actual" != "$sorted" ]; then
            echo "::error::dist/ holds '$actual' but the release must hold '$sorted'"
            exit 1
          fi
          echo "release contents: $actual"

      # `gh release create` is not idempotent, and a tag can be re-pointed at a
      # fixed commit, so replace any release that already exists for this tag.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false || true
          # The upload list is `dist/*` -- derived from what was actually
          # packaged, not written out again by hand. The step above has
          # already asserted what `dist/` holds, so the glob cannot pick up a
          # stray file.
          gh release create "$GITHUB_REF_NAME" \
            --title "InterJSON $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*

      # A checksum file that names a file the release does not carry is worse
      # than no checksum file: it sends a reader to verify something they
      # cannot download, and it makes a broken release look signed. v1.1.0
      # shipped a SHA256SUMS that listed the Windows binary while the release
      # attached only five files, because the upload list was not updated when
      # the Windows matrix entry was added.
      #
      # This gate compares the published asset set against the published
      # SHA256SUMS, and proves that the published SHA256SUMS is the file that
      # was just uploaded. `code/tests/release_assets.sh` is the same script
      # contributors run locally, so a release cannot pass here and fail there.
      - name: Verify the published assets match SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f code/tests/release_assets.sh ]; then
            echo "::error::code/tests/release_assets.sh is missing from the checkout; the asset gate cannot run"
            exit 1
          fi
          bash code/tests/release_assets.sh "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --sums-file dist/SHA256SUMS
