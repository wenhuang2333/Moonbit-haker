# Continuous integration: type check, tests on all three backends, CLI and
# demo smoke tests, differential report and coverage.
#
# Everything here is a command that also runs locally; docs/REPRODUCE.md has
# the same list for a manual run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this one, so a tag cannot publish a build whose
  # gates CI would reject. The release used to depend on two jobs that only
  # built and ran the binaries; a checksum says nothing about correctness, so
  # a red test suite did not stop a release.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moonbit:
    name: MoonBit (check, test, CLI, demo)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned. `install/unix.sh` with no argument installs
      # `latest`, and on 2026-10-29 a new MoonBit release changed the JavaScript
      # backend's output: the committed demo bundle stopped matching a rebuild,
      # `git diff --exit-code` failed, and the failure had nothing to do with the
      # commit under test. A gate whose verdict depends on what a third party
      # published overnight is not a gate. `MOONBIT_INSTALL_VERSION` is the
      # installer's own pin; bump it deliberately, together with the committed
      # bundles, the way `moon.mod` is bumped.
      - name: Install the MoonBit toolchain (pinned)
        env:
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION || '0.10.16+b1a0e846e' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # A pin that silently falls back to `latest` is worse than no pin, so the
      # version the installer actually produced is compared with the one asked
      # for.
      - name: Toolchain versions
        env:
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION || '0.10.16+b1a0e846e' }}
        run: |
          moon version --all
          # `MOONBIT_INSTALL_VERSION` names the *compiler* release
          # (`moonc v0.10.16+b1a0e846e`); `moon` itself reports its own
          # version. The pin is checked against moonc, which is the binary whose
          # output the committed bundles depend on.
          INSTALLED="$(moon version --all 2>&1 |
            sed -n 's/^moonc v\([^ ]*\).*/\1/p' | head -1)"
          echo "requested $MOONBIT_INSTALL_VERSION, installed moonc $INSTALLED"
          if [ "$INSTALLED" != "$MOONBIT_INSTALL_VERSION" ]; then
            echo "::error::the toolchain pin did not take: wanted $MOONBIT_INSTALL_VERSION, got moonc $INSTALLED"
            exit 1
          fi

      - name: Type check (warnings are errors)
        working-directory: code
        run: moon check --deny-warn

      - name: Formatting
        working-directory: code
        run: moon fmt --check

      - name: Test on wasm-gc, native and JavaScript
        working-directory: code
        run: |
          moon test
          moon test --target native
          moon test --target js

      # The byte-level fuzz, at a size the pull request can afford. The
      # property tests generate strings that look like damaged JSON; these
      # generate bytes, so "no panic on any byte sequence" is a claim with a
      # gate behind it rather than a sentence in a document. The nightly
      # workflow runs the same properties for far longer.
      - name: Byte-level fuzz (must exit 0)
        working-directory: code
        run: |
          INTERJSON_FUZZ=2000 moon test --target wasm-gc

      - name: The interface files are in sync
        working-directory: code
        run: moon info

      - name: LLM fixtures are in sync
        working-directory: code
        run: python3 tests/gen_llm_fixtures.py --check

      - name: LLM loopback transport recording and replay (must exit 0)
        working-directory: code
        run: |
          moon build cmd/interjson --target native --release
          python3 tests/run_llm_loopback.py \
            --cli ./_build/native/release/build/cmd/interjson/interjson.exe

      - name: Command line smoke test
        working-directory: code
        run: |
          moon build cmd/interjson --target native --release
          bash tests/cli_smoke.sh

      - name: Protocol and MCP conformance
        working-directory: code
        run: |
          python3 tests/conformance/run_conformance.py \
            --cli ./_build/native/release/build/cmd/interjson/interjson.exe

      - name: Python client and HTTP facade tests
        working-directory: code/python
        env:
          INTERJSON_BIN: ${{ github.workspace }}/code/_build/native/release/build/cmd/interjson/interjson.exe
        run: python3 -m unittest discover -s tests

      - name: Ground truth evaluation (must exit 0)
        working-directory: code
        run: |
          python3 tests/eval/run_eval.py \
            --cli ./_build/native/release/build/cmd/interjson/interjson.exe

      - name: Adversarial ambiguity suite and its guard (must exit 0)
        working-directory: code
        run: |
          python3 tests/eval/run_ambiguity.py \
            --cli ./_build/native/release/build/cmd/interjson/interjson.exe
          python3 tests/eval/check_amb_guard.py \
            --cli ./_build/native/release/build/cmd/interjson/interjson.exe

      - name: Chunked and adapter paths against the corpus (must exit 0)
        working-directory: code
        run: |
          python3 tests/eval/run_eval_paths.py \
            --cli ./_build/native/release/build/cmd/interjson/interjson.exe

      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            code/docs/EVAL.md
            code/docs/EVAL_PATHS.md
            code/docs/EVAL_AMBIGUITY.md
            code/docs/READINESS.md

      - name: Example inputs
        working-directory: code
        run: bash tests/examples.sh

      - name: Schema readiness table (must exit 0, table must show a gap and a tie)
        working-directory: code
        run: |
          python3 tests/eval/run_readiness.py \
            --cli ./_build/native/release/build/cmd/interjson/interjson.exe \
            --check

      # The ratios the memory documents quote are the ratios this build has.
      # `docs/MEMORY.md` is a report that only ever gets printed, so a figure
      # in it has drifted before without anything noticing; this measures the
      # same shapes and fails when one grows past its recorded ceiling.
      - name: Peak memory per shape (must exit 0)
        working-directory: code
        run: |
          moon build cmd/interjson --target native --release
          python3 tests/memory_gate.py \
            --cli ./_build/native/release/build/cmd/interjson/interjson.exe

      - name: Library coverage (floors and the monotonic ratchet are enforced)
        working-directory: code
        run: |
          # `tests/coverage.sh` runs the same report and then enforces the
          # 85%/90% floors and the monotonic exemption list. Running the raw
          # report here would print the numbers without failing on them, which
          # is the same as not having a gate: the ratchet only means something
          # if a regression can turn the build red.
          bash tests/coverage.sh

      - name: Browser demo bundle is in sync
        run: |
          bash static/demo/build.sh
          git diff --exit-code -- static/demo/interjson.js

      - name: npm package bundle is in sync
        run: |
          bash code/npm/build.sh
          git diff --exit-code -- code/npm/vendor/interjson.js

      - name: npm package tests
        working-directory: code/npm
        run: node --test

      # `claims.sh` checks the figures a document quotes. Which documents it
      # checks used to be decided by file arguments written at each check site,
      # and that list had drifted in both directions: it named two documents that
      # are not published (so those checks were skipped and reported as "not
      # published"), and it omitted one that is published. Neither state is
      # visible by reading the script, so the set is derived from the
      # `.gitignore` whitelist and compared.
      - name: Every published document is searched by the claims gate
        run: bash code/tests/published_docs.sh

      - name: The numbers the documents quote are the numbers this build produces
        working-directory: code
        run: |
          # A judge can check any figure in the README, and one wrong figure
          # discredits the table next to it. This re-derives the headline
          # numbers from the gates that run here and fails when a document
          # still quotes an older one.
          bash tests/claims.sh

      - name: Public interface files are in sync
        working-directory: code
        run: |
          # `pkg.generated.mbti` is the package's public API as the compiler
          # sees it. Committing it makes every API change show up in review
          # instead of arriving silently inside a feature diff -- which is what
          # a 1.0 compatibility promise needs in order to mean anything.
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Browser demo bundle smoke test
        run: node code/tests/demo_smoke.mjs

      - name: Agent gate example (end to end)
        working-directory: code
        run: moon run examples/agent_gate --target native --release

      - name: Self-healing agent loop example (end to end)
        working-directory: code
        run: moon run examples/agent_loop --target native --release

  windows:
    name: Windows (native build, protocol and MCP conformance)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install the MoonBit toolchain
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build the CLI
        working-directory: code
        shell: pwsh
        run: moon build cmd/interjson --target native --release

      - name: CLI smoke
        working-directory: code
        shell: pwsh
        run: |
          $J = ".\_build\native\release\build\cmd\interjson\interjson.exe"
          '{"a":1,}' | & $J
          & $J --version

      - name: Protocol and MCP conformance
        working-directory: code
        shell: pwsh
        run: |
          python tests/conformance/run_conformance.py --cli .\_build\native\release\build\cmd\interjson\interjson.exe

  differential:
    name: Differential and benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install the MoonBit toolchain
        env:
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION || '0.10.16+b1a0e846e' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the reference implementations
        run: |
          python3 -m pip install "json-repair==0.64.0"
          mkdir -p "$RUNNER_TEMP/node-oracle"
          cd "$RUNNER_TEMP/node-oracle"
          npm install --no-audit --no-fund "jsonrepair@3.15.0"

      # The committed report is the copy the next reader looks at, so CI has to
      # be able to say it is still the copy this build produces. It used to be
      # regenerated here and thrown away -- which is how the committed file came
      # to say "n/a (library not installed)" while every CI run measured against
      # a real `jsonrepair`. Regenerate, then diff.
      - name: Independent corpus (nst/JSONTestSuite, vendored)
        working-directory: code
        run: |
          moon build cmd/interjson --target native --release
          python3 tests/eval/run_independent.py \
            --cli ./_build/native/release/build/cmd/interjson/interjson.exe \
            --node-dir "$RUNNER_TEMP/node-oracle/node_modules"
          git diff --exit-code -- code/docs/EVAL_INDEPENDENT.md

      - name: Differential report (must exit 0)
        working-directory: code
        run: |
          moon build cmd/interjson --target native --release
          python3 tests/diff/run_diff.py \
            --cli ./_build/native/release/build/cmd/interjson/interjson.exe \
            --node-module-dir "$RUNNER_TEMP/node-oracle/node_modules" \
            --out "$RUNNER_TEMP/diff-report.md"

      - name: Benchmark (informational)
        working-directory: code
        run: bash tests/bench.sh native

      - name: Scaling and delta ratchets (must exit 0)
        working-directory: code
        run: |
          # NFR-PERF-01 and NFR-PERF-05 as ratios measured here, so the gate
          # travels between machines. The JavaScript scaling figure is printed
          # by `tests/bench.sh js` and quoted in the documents, but it is not
          # gated: a shared runner's GC timing moves it by more than the
          # regressions the gate would exist to catch.
          bash tests/scaling.sh

      - name: Benchmark, JavaScript (informational)
        working-directory: code
        run: bash tests/bench.sh js

      - uses: actions/upload-artifact@v4
        with:
          name: differential-report
          path: |
            ${{ runner.temp }}/diff-report.md
            code/docs/EVAL_INDEPENDENT.md
