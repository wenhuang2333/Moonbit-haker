# Continuous integration: type check, tests on all three backends, CLI and
# demo smoke tests, differential report and coverage.
#
# Everything here is a command that also runs locally; docs/REPRODUCE.md has
# the same list for a manual run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moonbit:
    name: MoonBit (check, test, CLI, demo)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install the MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: moon version --all

      - name: Type check (warnings are errors)
        working-directory: code
        run: moon check --deny-warn

      - name: Formatting
        working-directory: code
        run: moon fmt --check

      - name: Test on wasm-gc, native and JavaScript
        working-directory: code
        run: |
          moon test
          moon test --target native
          moon test --target js

      - name: LLM fixtures are in sync
        working-directory: code
        run: python3 tests/gen_llm_fixtures.py --check

      - name: Command line smoke test
        working-directory: code
        run: |
          moon build cmd/jsonmend --target native --release
          bash tests/cli_smoke.sh

      - name: Ground truth evaluation (must exit 0)
        working-directory: code
        run: |
          python3 tests/eval/run_eval.py \
            --cli ./_build/native/release/build/cmd/jsonmend/jsonmend.exe

      - name: Adversarial ambiguity suite and its guard (must exit 0)
        working-directory: code
        run: |
          python3 tests/eval/run_ambiguity.py \
            --cli ./_build/native/release/build/cmd/jsonmend/jsonmend.exe
          python3 tests/eval/check_amb_guard.py \
            --cli ./_build/native/release/build/cmd/jsonmend/jsonmend.exe

      - name: Chunked and adapter paths against the corpus (must exit 0)
        working-directory: code
        run: |
          python3 tests/eval/run_eval_paths.py \
            --cli ./_build/native/release/build/cmd/jsonmend/jsonmend.exe

      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            code/docs/EVAL.md
            code/docs/EVAL_PATHS.md
            code/docs/EVAL_AMBIGUITY.md
            code/docs/READINESS.md

      - name: Example inputs
        working-directory: code
        run: bash tests/examples.sh

      - name: Schema readiness table (must exit 0, table must show a gap and a tie)
        working-directory: code
        run: |
          python3 tests/eval/run_readiness.py \
            --cli ./_build/native/release/build/cmd/jsonmend/jsonmend.exe \
            --check

      - name: Library coverage
        working-directory: code
        run: |
          moon coverage clean
          moon test --enable-coverage
          echo "== library package =="
          moon coverage report -f summary -p zhanshishan/jsonmend
          echo "== including bench =="
          moon coverage report -f summary

      - name: Browser demo bundle is in sync
        run: |
          bash static/demo/build.sh
          git diff --exit-code -- static/demo/jsonmend.js

      - name: Browser demo bundle smoke test
        run: node code/tests/demo_smoke.mjs

      - name: Agent gate example (end to end)
        working-directory: code
        run: moon run examples/agent_gate --target native --release

      - name: Self-healing agent loop example (end to end)
        working-directory: code
        run: moon run examples/agent_loop --target native --release

  differential:
    name: Differential and benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install the MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the reference implementations
        run: |
          python3 -m pip install "json-repair==0.64.0"
          mkdir -p "$RUNNER_TEMP/node-oracle"
          cd "$RUNNER_TEMP/node-oracle"
          npm install --no-audit --no-fund "jsonrepair@3.15.0"

      - name: Independent corpus (nst/JSONTestSuite, vendored)
        working-directory: code
        run: |
          moon build cmd/jsonmend --target native --release
          python3 tests/eval/run_independent.py \
            --cli ./_build/native/release/build/cmd/jsonmend/jsonmend.exe \
            --node-dir "$RUNNER_TEMP/node-oracle/node_modules"

      - name: Differential report (must exit 0)
        working-directory: code
        run: |
          moon build cmd/jsonmend --target native --release
          python3 tests/diff/run_diff.py \
            --cli ./_build/native/release/build/cmd/jsonmend/jsonmend.exe \
            --node-module-dir "$RUNNER_TEMP/node-oracle/node_modules" \
            --out "$RUNNER_TEMP/diff-report.md"

      - name: Benchmark (informational)
        working-directory: code
        run: bash tests/bench.sh native

      - uses: actions/upload-artifact@v4
        with:
          name: differential-report
          path: |
            ${{ runner.temp }}/diff-report.md
            code/docs/EVAL_INDEPENDENT.md
