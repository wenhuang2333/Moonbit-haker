[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "interjson-moonbit"
version = "1.4.0"
description = "The local execution gate for LLM output: an MCP server and streaming JSON repair, powered by the MoonBit engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "InterJSON contributors" }]
keywords = ["json", "repair", "streaming", "llm", "tool-call", "mcp", "execution-gate", "moonbit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
interjson-mcp = "interjson.mcp:main"
interjson-http = "interjson.http:main"

[tool.setuptools]
packages = ["interjson"]
