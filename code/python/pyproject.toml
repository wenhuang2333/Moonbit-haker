[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "interjson-moonbit"
version = "1.5.0"
description = "The local execution gate for LLM output: an MCP server and streaming JSON repair, powered by the MoonBit engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "InterJSON contributors" }]
keywords = [
  "json",
  "repair",
  "streaming",
  "llm",
  "tool-call",
  "mcp",
  "execution-gate",
  "moonbit",
  "json-schema",
  "partial-json",
  "agent",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wenhuang2333/Moonbit-haker"
Repository = "https://github.com/wenhuang2333/Moonbit-haker"
Issues = "https://github.com/wenhuang2333/Moonbit-haker/issues"
Changelog = "https://github.com/wenhuang2333/Moonbit-haker/blob/main/code/CHANGELOG.md"

[project.scripts]
interjson-mcp = "interjson.mcp:main"
interjson-http = "interjson.http:main"

[tool.setuptools]
packages = ["interjson"]

# The package is typed, so the marker has to ship with it. Without it a type
# checker ignores the annotations and a consumer gets `Any` everywhere.
[tool.setuptools.package-data]
interjson = ["py.typed"]
