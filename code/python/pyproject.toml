[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonmend-moonbit"
version = "1.1.0"
description = "Streaming JSON repair and an execution gate for LLM tool calls, powered by the MoonBit engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "JSONMend contributors" }]
keywords = ["json", "repair", "streaming", "llm", "tool-call", "moonbit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
jsonmend-mcp = "jsonmend.mcp:main"
jsonmend-http = "jsonmend.http:main"

[tool.setuptools]
packages = ["jsonmend"]
